
name: Construir APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Descomprimir proyecto
        run: |
          unzip -o MiNegocioAndroid_proyecto.zip -d extracted

      - name: Construir aplicación
        run: gradle -p extracted/MiNegocioAndroid assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MiNegocio-APK
          path: extracted/MiNegocioAndroid/app/build/outputs/apk/debug/app-debug.apk
